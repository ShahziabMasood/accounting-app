name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          python -m PyInstaller --onefile --windowed --name "CustomerLedger" --collect-all reportlab accounting_app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CustomerLedger-Windows
          path: dist/CustomerLedger.exe
